---
layout: page
title: News
permalink: /news/
lead: Updates on NitoPath and its release.
---
<ul class="posts">
{% for post in site.posts %}
  <li><span class="date">{{ post.date | date: "%B %-d, %Y" }}</span><a href="{{ post.url }}">{{ post.title }}</a>
  {% if post.excerpt %}<div style="color:var(--muted)">{{ post.excerpt | strip_html | truncatewords: 30 }}</div>{% endif %}</li>
{% endfor %}
</ul>
