<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if page.url == "/" %}<title>NitoPath: navigation that knows where the cameras are</title>{% else %}<title>{{ page.title }} · NitoPath</title>{% endif %}
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:site_name" content="NitoPath">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ site.url }}/icon.png">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<script>
  // Halloween look all of October, in the visitor's own time zone. ?halloween=1 or 0 forces it on or off.
  (function () {
    var f = /[?&]halloween=([01])/.exec(location.search);
    if (f ? f[1] === '1' : new Date().getMonth() === 9) document.documentElement.classList.add('halloween');
  })();
</script>
<script>
  // Keep the hero hidden for a moment so its entrance animation doesn't flash; never longer than 2.5 s.
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.documentElement.classList.add('motion-pending');
    setTimeout(function () { document.documentElement.classList.remove('motion-pending'); }, 2500);
  }
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cookie&display=swap&text=Buy%20me%20a%20coffe">
<link rel="stylesheet" href="/assets/site.css?v={{ site.time | date: '%s' }}">
<script defer src="/assets/vendor/gsap.min.js?v=3.13.0"></script>
<script defer src="/assets/vendor/ScrollTrigger.min.js?v=3.13.0"></script>
<script defer src="/assets/vendor/SplitText.min.js?v=3.13.0"></script>
<script defer src="/assets/vendor/lenis.min.js?v=1.3.4"></script>
<script defer src="/assets/motion.js?v={{ site.time | date: '%s' }}"></script>
<script>
  // A password-reset link that lands here (Supabase sends it to the Site URL when the reset page is
  // missing from its Redirect URLs) goes on to the reset page with its one-time session intact.
  if (/(^|[#?&])type=recovery(&|$)/.test(location.hash + '&' + location.search.slice(1))) {
    location.replace('/reset.html' + location.search + location.hash);
  }
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{% include header.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
</body>
</html>
