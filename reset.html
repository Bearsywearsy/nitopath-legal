<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NitoPath — Reset password</title>
<style>
  :root { color-scheme: light dark; --fg: #16181d; --muted: #5b6470; --bg: #ffffff; --card: #f6f7f9;
          --rule: #e4e7eb; --accent: #2563eb; --danger: #dc2626; --ok: #16a34a; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #eef1f5; --muted: #9aa4b1; --bg: #0f1115; --card: #171a20; --rule: #2b3139;
            --accent: #60a5fa; --danger: #f87171; --ok: #4ade80; }
  }
  body { margin: 0 auto; padding: 56px 20px; max-width: 26rem; background: var(--bg); color: var(--fg);
         font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p.sub { color: var(--muted); margin-top: 0; }
  label { display: block; font-weight: 600; font-size: .9rem; margin: 18px 0 6px; }
  input { width: 100%; box-sizing: border-box; padding: 13px 14px; font-size: 16px; border-radius: 10px;
          border: 1px solid var(--rule); background: var(--card); color: var(--fg); }
  button { width: 100%; margin-top: 22px; padding: 15px; font-size: 16px; font-weight: 700; border: 0;
           border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  button[disabled] { opacity: .55; cursor: default; }
  .msg { margin-top: 18px; padding: 13px 15px; border-radius: 10px; font-size: .92rem; display: none; }
  .msg.err { display: block; background: rgba(220,38,38,.12); color: var(--danger); }
  .msg.ok { display: block; background: rgba(22,163,74,.12); color: var(--ok); }
  footer { margin-top: 42px; border-top: 1px solid var(--rule); padding-top: 14px;
           color: var(--muted); font-size: .82rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <h1>Choose a new password</h1>
  <p class="sub" id="who">Checking your reset link…</p>

  <form id="form" style="display:none">
    <label for="pw">New password</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="8" required>
    <label for="pw2">Confirm password</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
    <button id="go" type="submit">Save new password</button>
  </form>

  <div class="msg" id="msg"></div>

  <footer>
    After saving, open NitoPath and sign in with the new password.<br>
    <a href="./">Privacy policy and terms</a> · <a href="mailto:Nitopath@gmail.com">Nitopath@gmail.com</a>
  </footer>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// Publishable key: safe in a browser, and row level security still applies.
const supabase = createClient(
  'https://fqwllcpaadrwujyzddda.supabase.co',
  'sb_publishable_U9mj_OskHw6ZotXFKjng9g_dI6BBZJS',
  { auth: { persistSession: false, detectSessionInUrl: false } },
);

const who = document.getElementById('who');
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const go = document.getElementById('go');

const show = (text, kind) => {
  msg.textContent = text;
  msg.className = 'msg ' + kind;
};

// Supabase appends the one-time session to the URL fragment.
const params = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
const access_token = params.get('access_token');
const refresh_token = params.get('refresh_token');
const linkError = params.get('error_description') || params.get('error');

if (linkError) {
  who.textContent = '';
  show(decodeURIComponent(linkError).replace(/\+/g, ' ') + ' — request a new reset email from the app.', 'err');
} else if (!access_token || !refresh_token) {
  who.textContent = '';
  show('This page needs to be opened from the link in your reset email.', 'err');
} else {
  const { data, error } = await supabase.auth.setSession({ access_token, refresh_token });
  if (error) {
    who.textContent = '';
    show('That link has expired or was already used. Request a new one from the app.', 'err');
  } else {
    who.textContent = data.user?.email ? `Signed in as ${data.user.email}` : 'Link verified.';
    form.style.display = 'block';
    // Keep the tokens out of the address bar and browser history.
    history.replaceState(null, '', location.pathname);
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  if (pw.length < 8) return show('Use at least 8 characters.', 'err');
  if (pw !== pw2) return show('The two passwords do not match.', 'err');

  go.disabled = true;
  go.textContent = 'Saving…';
  const { error } = await supabase.auth.updateUser({ password: pw });
  go.disabled = false;
  go.textContent = 'Save new password';

  if (error) return show(error.message, 'err');
  form.style.display = 'none';
  who.textContent = '';
  show('Password changed. Open NitoPath and sign in with your new password.', 'ok');
  await supabase.auth.signOut();
});
</script>
</body>
</html>
