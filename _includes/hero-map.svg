<svg viewBox="0 0 320 620" role="img" aria-labelledby="hero-map-title" class="hero-map">
  <title id="hero-map-title">Illustration of NitoPath comparing two routes: the fastest passes 7 cameras, the chosen one passes 1</title>
  <defs>
    <clipPath id="screen"><rect x="12" y="12" width="296" height="596" rx="34"/></clipPath>
    <radialGradient id="cam-halo"><stop offset="0" stop-color="#f87171" stop-opacity=".55"/><stop offset="1" stop-color="#f87171" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="2" y="2" width="316" height="616" rx="42" fill="#05070a" stroke="#2b3139" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect x="12" y="12" width="296" height="596" fill="#141922"/>
    <!-- streets -->
    <g stroke="#232a35" stroke-width="7" stroke-linecap="round">
      <path d="M12 120 H308 M12 210 H308 M12 300 H308 M12 390 H308"/>
      <path d="M70 12 V470 M150 12 V470 M230 12 V470"/>
      <path d="M12 60 L308 250" stroke-width="10" stroke="#29313d"/>
    </g>
    <path d="M40 330 Q90 300 120 255 T175 170 Q205 128 255 92" fill="none" stroke="#1d2a3d" stroke-width="22" stroke-linecap="round"/>
    <!-- park and water -->
    <rect x="160" y="310" width="62" height="70" rx="10" fill="#15281f"/>
    <path d="M12 430 Q90 410 170 440 T308 425 V470 H12 Z" fill="#132235"/>
    <!-- fastest route (grey) -->
    <path d="M70 405 V300 H150 V210 H230 V120 L250 96" fill="none" stroke="#64748b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    <!-- chosen route (blue) -->
    <path d="M70 405 H40 V330 Q90 300 120 255 T175 170 Q205 128 250 96" fill="none" stroke="#3b82f6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- cameras on fastest route -->
    <g>
      <circle cx="70" cy="350" r="15" fill="url(#cam-halo)"/><circle cx="70" cy="350" r="6" fill="#f87171" stroke="#fff" stroke-width="2"/>
      <circle cx="112" cy="300" r="15" fill="url(#cam-halo)"/><circle cx="112" cy="300" r="6" fill="#f87171" stroke="#fff" stroke-width="2"/>
      <circle cx="150" cy="255" r="15" fill="url(#cam-halo)"/><circle cx="150" cy="255" r="6" fill="#f87171" stroke="#fff" stroke-width="2"/>
      <circle cx="190" cy="210" r="15" fill="url(#cam-halo)"/><circle cx="190" cy="210" r="6" fill="#f87171" stroke="#fff" stroke-width="2"/>
      <circle cx="230" cy="165" r="15" fill="url(#cam-halo)"/><circle cx="230" cy="165" r="6" fill="#f87171" stroke="#fff" stroke-width="2"/>
      <circle cx="230" cy="130" r="15" fill="url(#cam-halo)"/><circle cx="230" cy="130" r="6" fill="#f87171" stroke="#fff" stroke-width="2"/>
      <circle cx="150" cy="226" r="15" fill="url(#cam-halo)"/><circle cx="150" cy="226" r="6" fill="#f87171" stroke="#fff" stroke-width="2"/>
      <!-- a camera on neither route -->
      <circle cx="270" cy="270" r="15" fill="url(#cam-halo)"/><circle cx="270" cy="270" r="6" fill="#f87171" stroke="#fff" stroke-width="2"/>
      <!-- the one camera on the chosen route -->
      <circle cx="176" cy="168" r="15" fill="url(#cam-halo)"/><circle cx="176" cy="168" r="6" fill="#f87171" stroke="#fff" stroke-width="2"/>
    </g>
    <!-- start and destination -->
    <circle cx="70" cy="405" r="9" fill="#16a34a" stroke="#fff" stroke-width="3"/>
    <path d="M250 70 c-12 0 -20 9 -20 20 c0 15 20 32 20 32 s20 -17 20 -32 c0 -11 -8 -20 -20 -20z" fill="#ef4444" stroke="#fff" stroke-width="2.5"/>
    <circle cx="250" cy="90" r="6" fill="#fff"/>
    <!-- search bar -->
    <rect x="26" y="30" width="268" height="40" rx="20" fill="#1c222c" stroke="#2b3139"/>
    <circle cx="48" cy="50" r="6" fill="none" stroke="#9aa4b1" stroke-width="2"/><path d="M52 54 l5 5" stroke="#9aa4b1" stroke-width="2" stroke-linecap="round"/>
    <text x="66" y="55" fill="#eef1f5" font-size="14" font-family="system-ui, sans-serif" font-weight="600">Piedmont Park</text>
    <!-- route sheet -->
    <rect x="12" y="460" width="296" height="160" rx="22" fill="#1c222c"/>
    <rect x="140" y="470" width="40" height="4" rx="2" fill="#3a4250"/>
    <rect x="26" y="486" width="268" height="52" rx="12" fill="#232a35" stroke="#3b82f6" stroke-width="2"/>
    <text x="40" y="510" fill="#eef1f5" font-size="17" font-weight="800" font-family="system-ui, sans-serif">18 min</text>
    <text x="40" y="527" fill="#9aa4b1" font-size="11" font-family="system-ui, sans-serif">5.1 mi · Fewer cameras</text>
    <rect x="236" y="500" width="46" height="24" rx="12" fill="#14361f"/>
    <text x="259" y="517" fill="#4ade80" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">● 1</text>
    <rect x="26" y="546" width="268" height="52" rx="12" fill="none" stroke="#2b3139" stroke-width="2"/>
    <text x="40" y="570" fill="#eef1f5" font-size="17" font-weight="800" font-family="system-ui, sans-serif">16 min</text>
    <text x="40" y="587" fill="#9aa4b1" font-size="11" font-family="system-ui, sans-serif">4.6 mi · Fastest</text>
    <rect x="236" y="560" width="46" height="24" rx="12" fill="#3b1416"/>
    <text x="259" y="577" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">● 7</text>
  </g>
</svg>
