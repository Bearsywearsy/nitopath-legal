<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NitoPath — Email confirmed</title>
<style>
  :root { color-scheme: light dark; --fg: #16181d; --muted: #5b6470; --bg: #ffffff; --rule: #e4e7eb; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #eef1f5; --muted: #9aa4b1; --bg: #0f1115; --rule: #2b3139; --accent: #60a5fa; }
  }
  body { margin: 0 auto; padding: 72px 20px; max-width: 34rem; background: var(--bg); color: var(--fg);
         font: 16px/1.65 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; text-align: center; }
  .tick { width: 72px; height: 72px; border-radius: 36px; background: var(--accent); color: #fff;
          font-size: 38px; line-height: 72px; margin: 0 auto 20px; }
  h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
  p { color: var(--muted); }
  a.btn { display: inline-block; margin-top: 24px; padding: 14px 26px; border-radius: 10px;
          background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  footer { margin-top: 48px; border-top: 1px solid var(--rule); padding-top: 16px; font-size: .85rem; color: var(--muted); }
</style>
<script>
  // A password-reset link that lands here (Supabase sends it to the Site URL when the reset page is
  // missing from its Redirect URLs) goes on to the reset page with its one-time session intact.
  if (/(^|[#?&])type=recovery(&|$)/.test(location.hash + '&' + location.search.slice(1))) {
    location.replace('/reset.html' + location.search + location.hash);
  }
</script>
</head>
<body>
  <div class="tick">&check;</div>
  <h1>Email confirmed</h1>
  <p>Your NitoPath account is ready. Sign in to keep your settings, saved places and trips on all your devices.</p>
  <!-- The web app works on any computer or phone; the nitopath:// link did nothing without the app installed. -->
  <a class="btn" href="/app/account/">Sign in to NitoPath</a>
  <footer>
    <a href="/privacy-policy.html">Privacy policy</a> · <a href="/terms-of-service.html">Terms</a> · <a href="mailto:Nitopath@gmail.com">Nitopath@gmail.com</a>
  </footer>
</body>
</html>
